<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}JobFeed{% endblock %}</title>
  <meta name="description" content="{% block description %}JobFeed — your personalised job aggregator{% endblock %}" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>

  <style>
    /* ── CSS Reset & Variables ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --border: #2a2a4a;
      --accent: #e94560;
      --accent2: #0f3460;
      --text: #e0e0f0;
      --text-muted: #888aaa;
      --success: #22c55e;
      --warning: #f59e0b;
      --info: #3b82f6;
      --radius: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --font: 'Inter', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Navigation ───────────────────────────────────────────────── */
    .nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .nav-brand span { color: var(--text); }
    .nav-links { display: flex; gap: 0.25rem; margin-left: 1rem; }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s, background 0.2s;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text);
      background: var(--border);
    }
    .nav-spacer { flex: 1; }
    .nav-user {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* ── Layout ───────────────────────────────────────────────────── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .page-header {
      margin-bottom: 1.5rem;
    }
    .page-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }
    .page-header p { color: var(--text-muted); margin-top: 0.25rem; }

    /* ── Cards ────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .card-title { font-weight: 600; font-size: 1rem; }

    /* ── Buttons ──────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #d63651; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: #3a3a5a; }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }
    .btn-danger { background: #dc2626; color: #fff; }

    /* ── Forms ────────────────────────────────────────────────────── */
    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      color: var(--text-muted);
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      padding: 0.55rem 0.8rem;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent);
    }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    .checkbox-label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.875rem; cursor: pointer; }
    .checkbox-label input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }

    /* ── Table ────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      text-align: left;
      padding: 0.65rem 0.75rem;
      background: var(--surface2);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    th:hover { color: var(--text); }
    td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── Badges ───────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .badge-remote { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge-ats { background: var(--border); color: var(--text-muted); }
    .badge-new { background: rgba(59,130,246,0.15); color: var(--info); }
    .badge-applied { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge-skipped { background: rgba(107,114,128,0.2); color: #6b7280; }
    .badge-interview { background: rgba(245,158,11,0.15); color: var(--warning); }

    /* ── Stats strip ─────────────────────────────────────────────── */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }
    .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.2rem; }

    /* ── Alerts ───────────────────────────────────────────────────── */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }
    .alert-error { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); color: #fca5a5; }
    .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .alert-info { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); color: #93c5fd; }

    /* ── Score bar ────────────────────────────────────────────────── */
    .score-pill {
      display: inline-block;
      min-width: 36px;
      text-align: center;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      background: rgba(233,69,96,0.15);
      color: var(--accent);
    }

    /* ── HTMX loading indicator ───────────────────────────────────── */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Misc ─────────────────────────────────────────────────────── */
    .text-muted { color: var(--text-muted); }
    .text-accent { color: var(--accent); }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .flex { display: flex; }
    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .w-full { width: 100%; }
    select.status-select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .notes-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      width: 100%;
    }
    .notes-input:focus { outline: none; border-color: var(--accent); }
    .saved-flash { color: var(--success); font-size: 0.75rem; margin-left: 0.4rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

{% if current_user %}
<nav class="nav">
  <a href="/" class="nav-brand">Job<span>Feed</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
    <a href="/profiles" class="nav-link {% if '/profiles' in request.url.path %}active{% endif %}">Profiles</a>
    {% if current_user.is_admin %}
    <a href="/admin" class="nav-link {% if '/admin' in request.url.path %}active{% endif %}">Admin</a>
    {% endif %}
  </div>
  <div class="nav-spacer"></div>
  <div class="nav-user">
    <span>{{ current_user.display_name or current_user.email }}</span>
    <a href="/logout" class="btn btn-ghost btn-sm">Sign out</a>
  </div>
</nav>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

<script>
  // Auto-dismiss flash messages
  setTimeout(() => {
    document.querySelectorAll('.saved-flash').forEach(el => el.remove());
  }, 2500);
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
