{% extends "base.html" %}
{% block title %}Sign In — JobFeed{% endblock %}
{% block description %}Sign in to your JobFeed account{% endblock %}

{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;">
  <div style="width:100%;max-width:400px;">

    <div style="text-align:center;margin-bottom:2rem;">
      <h1 style="font-size:2rem;font-weight:700;color:var(--accent);">Job<span style="color:var(--text);">Feed</span></h1>
      <p style="color:var(--text-muted);margin-top:0.5rem;">Your personal job aggregator</p>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Sign In</span>
        <a href="/register" style="font-size:0.85rem;color:var(--accent);text-decoration:none;">Create account →</a>
      </div>

      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input id="email" name="email" type="email" class="form-input"
                 placeholder="you@example.com" required autofocus />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-input"
                 placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary w-full" style="justify-content:center;">
          Sign In
        </button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
