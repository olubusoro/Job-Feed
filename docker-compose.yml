version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount code for hot-reload in dev; remove in production
      - .:/app
      # Persist the SQLite DB
      - jobfeed_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/jobfeed.db
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped

volumes:
  jobfeed_data:
